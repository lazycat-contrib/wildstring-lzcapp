version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/wildstring.lpk
  target_arch: amd64

# 版本跟随上游镜像 tag
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: wildstring

build:
  run_buildscript: false

images:
  - id: wildstring
    target: service
    service: wildstring
    source: ghcr.io/qingmuhy744/wildstring
    channel: stable
    tag_regex: '^\d+\.\d+\.\d+$'
    version_regex: '^(?P<version>\d+\.\d+\.\d+)$'
    delivery:
      # 官方商店要求镜像来自 registry.lazycat.cloud，由 Action 自动转存
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: false
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: 野弦
    summary: "AI 原生的自托管无损音乐与播客空间：自然语言找歌、AI 情绪歌单、逐字歌词、播客托管"
